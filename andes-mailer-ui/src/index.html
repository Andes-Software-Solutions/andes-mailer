<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Andes Mailer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Sets the theme before the first paint; main.ts runs too late to stop a light flash on a slow
      load. Mirrors applyInitialTheme in src/app/core/theme/theme-preference.ts: keep them in step.
    -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('andes-mailer.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
