<h1 class="mb-0">
  @if (firstName()) {
    Welcome, {{ firstName() }}
  } @else {
    Welcome
  }
</h1>

<div class="card">
  @if (session.activeTeam(); as team) {
    <app-empty-state
      icon="envelope-paper"
      title="Pick up where you left off"
      [text]="'You are working in ' + team.name + '. Choose a page from the menu to get started.'"
    />
  } @else {
    <app-empty-state
      icon="people"
      title="You're not on a team yet"
      text="Ask a team administrator to add you to a team, then sign in again."
    />
  }
</div>
