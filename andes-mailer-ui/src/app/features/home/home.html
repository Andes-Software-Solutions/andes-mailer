<header class="bg-primary py-4">
  <div class="container">
    <img
      ngSrc="andes-mark-white.png"
      width="166"
      height="66"
      priority
      alt="Andes Software Solutions logo"
    />
  </div>
</header>

<main class="container py-4">
  <h1>Andes Mailer</h1>
  <p class="lead">Send and manage email for Andes applications.</p>

  @if (user.hasValue()) {
    <p>Signed in as {{ user.value().name }}</p>
  } @else if (user.error()) {
    <p class="text-danger-emphasis" role="alert">We couldn't load your account.</p>
  }
</main>
