<main class="container py-4">
  <h1 class="h3">We couldn't sign you in</h1>
  <p>Sign-in with your work account didn't finish.</p>

  @if (retryFailed()) {
    <p class="text-danger-emphasis" role="alert">
      We couldn't reach Microsoft. Check your connection, then reload this page.
    </p>
  } @else {
    <button class="btn btn-primary" type="button" [disabled]="retrying()" (click)="retry()">
      Try again
    </button>
  }
</main>
